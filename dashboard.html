<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>RSVP Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/builder.css">
<style>
  html, body { height: auto; overflow: auto; }
  .dash-page { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }
  .dash-page h1 { font-size: 22px; margin: 0 0 4px; }
</style>
</head>
<body>
<div class="dash-page">
  <h1>💌 RSVP dashboard</h1>
  <p class="hint">Private link — anyone with it can see replies. Don't share it with guests.</p>
  <div id="dash"></div>
</div>
<script type="module">
  import { mountDashboard } from './js/dashboard.js';
  const h = new URLSearchParams(location.hash.slice(1));
  const el = document.getElementById('dash');
  if (!h.get('w') || !h.get('k')) el.innerHTML = '<p class="err">This link is incomplete. Copy the dashboard link again from the builder’s Guests tab.</p>';
  else {
    if (h.get('t')) document.querySelector('h1').textContent = '💌 ' + h.get('t');
    mountDashboard(el, { weddingId: h.get('w'), adminKey: h.get('k'), title: 'wedding' });
  }
</script>
</body>
</html>
